<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexis Blink | AI Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
--bg-dark: #03050d;
--sidebar-bg: rgba(4, 6, 15, 0.65);
--chat-bg: rgba(6, 8, 22, 0.4); 
--panel-bg: rgba(10, 15, 38, 0.5);
--primary-gradient: linear-gradient(135deg, #0052d4 0%, #4364f7 50%, #00c6ff 100%);
--glow-blue: rgba(67, 100, 247, 0.25);
--text-main: #f8fafc;
--text-muted: #94a3b8;
--glass-blur: blur(25px);
--transition-premium: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
-webkit-font-smoothing: antialiased;
}

body {
background-color: var(--bg-dark);
background-image: linear-gradient(rgba(3, 5, 13, 0.5), rgba(3, 5, 13, 0.75)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop');
background-size: cover;
background-position: center;
background-attachment: fixed;
display: flex;
flex-direction: column; 
min-height: 100vh;
height: 100vh;
color: var(--text-main);
overflow: hidden;
}

/* --- Top Authentication Bar --- */
.top-auth-bar {
display: flex;
align-items: center;
justify-content: flex-end;
gap: 15px;
padding: 15px 40px;
background: rgba(4, 6, 15, 0.4);
border-bottom: 1px solid rgba(255, 255, 255, 0.05);
z-index: 100;
flex-shrink: 0;
}

.trial-badge {
background: rgba(255, 193, 7, 0.15);
border: 1px solid rgba(255, 193, 7, 0.3);
color: #ffc107;
padding: 8px 14px;
border-radius: 10px;
font-size: 13px;
font-weight: 600;
display: flex;
align-items: center;
gap: 8px;
}

.auth-btn {
padding: 10px 20px;
border-radius: 12px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: var(--transition-premium);
}

.btn-signin {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08);
color: white;
}
.btn-signin:hover {
background: rgba(255, 255, 255, 0.08);
border-color: rgba(255, 255, 255, 0.2);
}

.btn-signup {
background: var(--primary-gradient);
border: none;
color: white;
box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
}
.btn-signup:hover {
transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(67, 100, 247, 0.4);
}

.user-profile-badge {
display: none;
align-items: center;
gap: 10px;
background: rgba(10, 15, 38, 0.6);
border: 1px solid rgba(0, 198, 255, 0.2);
padding: 6px 14px;
border-radius: 14px;
}
.user-profile-badge i { color: #00c6ff; }

.btn-logout {
background: rgba(239, 68, 68, 0.1);
border: 1px solid rgba(239, 68, 68, 0.2);
color: #f87171;
display: none; 
}
.btn-logout:hover {
background: #ef4444;
color: white;
box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
}

/* App Main Wrapper */
.app-core {
display: flex;
flex: 1;
width: 100%;
overflow: hidden;
}

/* --- Auth Overlay Modal --- */
.auth-overlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: rgba(3, 5, 13, 0.85);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
z-index: 999;
display: flex;
justify-content: center;
align-items: center;
opacity: 1;
pointer-events: all;
transition: opacity 0.4s ease;
}

.auth-overlay.hidden {
opacity: 0;
pointer-events: none;
}

.auth-card {
background: rgba(6, 8, 22, 0.7);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 28px;
width: 90%;
max-width: 440px;
padding: 30px;
box-shadow: 0 30px 70px rgba(0,0,0,0.8);
display: flex;
flex-direction: column;
gap: 20px;
text-align: center;
}

.auth-card h2 {
font-size: 24px;
font-weight: 800;
background: var(--primary-gradient);
background-clip: text;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.auth-inputs {
display: flex;
flex-direction: column;
gap: 12px;
}

.input-field {
background: rgba(10, 15, 38, 0.6);
border: 1px solid rgba(0, 198, 255, 0.15);
border-radius: 14px;
padding: 14px;
color: white;
outline: none;
}

.submit-auth-btn {
background: var(--primary-gradient);
color: white;
border: none;
padding: 14px;
border-radius: 14px;
font-weight: 600;
cursor: pointer;
}

.social-divider {
display: flex;
align-items: center;
color: var(--text-muted);
font-size: 12px;
}
.social-divider::before, .social-divider::after {
content: '';
flex: 1;
border-bottom: 1px solid rgba(255, 255, 255, 0.08);
margin: 0 10px;
}

.social-btns {
display: flex;
gap: 12px;
}

.social-btn {
flex: 1;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.06);
color: white;
padding: 12px;
border-radius: 12px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}

.switch-auth span {
color: #00c6ff;
cursor: pointer;
font-weight: 600;
}

.free-trial-trigger-btn {
background: linear-gradient(135deg, rgba(255, 193, 7, 0.15), rgba(255, 87, 34, 0.1));
border: 1px solid rgba(255, 193, 7, 0.4);
color: #ffc107;
padding: 14px;
border-radius: 14px;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}

/* --- Sidebar --- */
.sidebar {
width: 280px;
background-color: var(--sidebar-bg);
backdrop-filter: var(--glass-blur);
border-right: 1px solid rgba(255, 255, 255, 0.05);
display: flex;
flex-direction: column;
padding: 20px;
gap: 20px;
flex-shrink: 0;
}

.brand-logo {
font-size: 22px;
font-weight: 900;
letter-spacing: 2px;
background: var(--primary-gradient);
background-clip: text;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
display: flex;
align-items: center;
gap: 10px;
}

.new-chat-btn {
background: rgba(0, 198, 255, 0.05);
border: 1px solid rgba(0, 198, 255, 0.15);
color: white;
padding: 12px;
border-radius: 12px;
cursor: pointer;
font-weight: 600;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}
.new-chat-btn:hover { background: var(--primary-gradient); }

.history-list {
flex: 1;
display: flex;
flex-direction: column;
gap: 8px;
overflow-y: auto;
}

.history-item {
padding: 12px;
border-radius: 10px;
font-size: 14px;
color: var(--text-muted);
cursor: pointer;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display: flex;
align-items: center;
gap: 10px;
border: 1px solid transparent;
}
.history-item:hover, .history-item.active {
background: rgba(67, 100, 247, 0.12);
color: white;
border-color: rgba(67, 100, 247, 0.25);
}

/* --- Main Chat --- */
.main-chat {
flex: 1;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
overflow: hidden;
}

.chat-container {
width: 100%;
max-width: 1000px;
height: 100%;
background-color: var(--chat-bg);
backdrop-filter: var(--glass-blur);
border-radius: 24px;
border: 1px solid rgba(255, 255, 255, 0.06);
display: flex;
flex-direction: column;
overflow: hidden;
}

.chat-header {
padding: 15px 25px;
background: rgba(4, 6, 15, 0.4);
border-bottom: 1px solid rgba(255, 255, 255, 0.05);
display: flex;
align-items: center;
justify-content: space-between;
}

.header-left { display: flex; align-items: center; }
.logo-wrapper { width: 40px; height: 40px; margin-right: 12px; }
.logo-image { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; border: 1px solid #00c6ff; }
.header-info h3 { font-size: 16px; color: white; }

.header-actions button {
background: rgba(255, 255, 255, 0.02);
border: 1px solid rgba(255, 255, 255, 0.05);
color: var(--text-muted);
cursor: pointer;
padding: 8px;
border-radius: 8px;
}

.chat-box {
flex: 1;
padding: 20px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 20px;
}

.message-wrapper { display: flex; width: 100%; gap: 12px; }
.user-wrapper { justify-content: flex-end; }
.message { display: flex; flex-direction: column; max-width: 80%; }
.message-text { padding: 14px 18px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
.bot-message .message-text { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); color: #f1f5f9; border-top-left-radius: 4px; }
.user-message .message-text { background: var(--primary-gradient); color: white; border-top-right-radius: 4px; }

.input-wrapper {
padding: 15px 20px;
background: rgba(3, 5, 13, 0.6);
display: flex;
flex-direction: column;
gap: 10px;
}

.input-container {
display: flex;
align-items: center;
background-color: var(--panel-bg);
border: 1px solid rgba(0, 198, 255, 0.15);
border-radius: 18px;
padding: 8px 8px 8px 16px;
}

.input-container input { flex: 1; background: none; border: none; color: white; font-size: 15px; outline: none; }
.input-container button { background: var(--primary-gradient); color: white; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; }

.model-select {
background: rgba(10, 15, 38, 0.6);
border: 1px solid rgba(0, 198, 255, 0.15);
color: var(--text-muted);
padding: 6px 12px;
border-radius: 8px;
font-size: 12px;
outline: none;
cursor: pointer;
}

/* Typing Loader */
.typing-indicator { display: inline-flex; gap: 4px; align-items: center; }
.typing-indicator span { width: 6px; height: 6px; background: #00c6ff; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out both; }
.typing-indicator span:nth-child(1) { animation-delay: -0.3s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.15s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; } 40% { transform: scale(1.2); opacity: 1; } }

/* --- Footer --- */
.cosmic-footer {
padding: 15px 40px;
background: rgba(4, 6, 15, 0.8);
border-top: 1px solid rgba(255, 255, 255, 0.05);
display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
flex-shrink: 0;
z-index: 50;
}

.footer-credits { font-size: 12px; color: var(--text-muted); }
.footer-credits span { color: #00c6ff; font-weight: 700; }
.footer-info-grid { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.footer-item { display: flex; align-items: center; gap: 8px; color: var(--text-main); text-decoration: none; font-size: 13px; background: rgba(255, 255, 255, 0.02); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.04); }
.footer-socials { display: flex; align-items: center; gap: 8px; }
.social-icon-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); color: var(--text-muted); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; }

/* --- 📱 ANDROID & MOBILE RESPONSIVE AUTO-SIZE --- */
@media (max-width: 768px) {
body {
height: auto;
min-height: 100vh;
overflow-y: auto;
}

.top-auth-bar {
padding: 12px;
justify-content: center;
flex-wrap: wrap;
gap: 8px;
}

.auth-btn {
padding: 8px 14px;
font-size: 12px;
flex: 1;
text-align: center;
max-width: 140px;
}

.app-core {
flex-direction: column;
overflow: visible;
}

.sidebar { display: none; }

.main-chat {
padding: 10px;
height: calc(100vh - 180px); /* Auto-resize sans overlapping avec le clavier */
min-height: 460px;
}

.chat-container {
border-radius: 16px;
height: 100%;
}

.chat-box { padding: 12px; gap: 12px; }
.message-text { font-size: 13.5px; padding: 10px 14px; }
.input-wrapper { padding: 10px; }

.cosmic-footer {
flex-direction: column;
padding: 20px 15px;
text-align: center;
height: auto;
}

.footer-info-grid {
flex-direction: column;
width: 100%;
gap: 10px;
}

.footer-item {
width: 100%;
justify-content: center;
}
}
</style>
</head>

<script>
const GROQ_API_KEY = "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";

const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const historyList = document.querySelector('.history-list');
const modelSelect = document.getElementById('modelSelect');
const authOverlay = document.getElementById('authOverlay');
const authTitle = document.getElementById('authTitle');
const authDesc = document.getElementById('authDesc');
const submitAuthBtn = document.getElementById('submitAuthBtn');
const switchAuthTax = document.getElementById('switchAuthTax');
const trialBtn = document.getElementById('trialBtn');
const trialDivider = document.getElementById('trialDivider');
const trialTimerBadge = document.getElementById('trialTimerBadge');
const timerValue = document.getElementById('timerValue');
const userProfileBadge = document.getElementById('userProfileBadge');
const profileName = document.getElementById('profileName');
const topSignInBtn = document.getElementById('topSignInBtn');
const topSignUpBtn = document.getElementById('topSignUpBtn');
const topLogoutBtn = document.getElementById('topLogoutBtn');

let currentChatId = null;
let isTyping = false; 
let authMode = "signin"; 
let timerInterval = null;

document.addEventListener("DOMContentLoaded", () => {
  renderHistorySidebar();
  startNewChat(); 
  checkUserSession();

  sendBtn.addEventListener('click', () => sendMessage());
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
});

function checkUserSession() {
  const account = localStorage.getItem("nexis_user_account");
  const trialStart = localStorage.getItem("nexis_trial_start");
  if (account) {
    authOverlay.classList.add('hidden');
    topSignInBtn.style.display = 'none';
    topSignUpBtn.style.display = 'none';
    userProfileBadge.style.display = 'flex';
    topLogoutBtn.style.display = 'block'; 
    profileName.innerText = account;
    trialTimerBadge.style.display = 'none';
  } else if (trialStart) {
    authOverlay.classList.add('hidden');
    topSignInBtn.style.display = 'block';
    topSignUpBtn.style.display = 'block';
    topLogoutBtn.style.display = 'none'; 
    startCountdown(parseInt(trialStart));
  } else {
    topLogoutBtn.style.display = 'none';
    openAuthModal('signin');
  }
}

function handleLogout() {
  if (confirm("T7ebb ta3mel log out?")) {
    localStorage.removeItem("nexis_user_account");
    localStorage.removeItem("nexis_trial_start"); 
    if(timerInterval) clearInterval(timerInterval);
    checkUserSession();
  }
}

function openAuthModal(mode) {
  authOverlay.classList.remove('hidden');
  toggleAuthMode(mode);
}

function toggleAuthMode(mode) {
  authMode = mode;
  const trialStart = localStorage.getItem("nexis_trial_start");
  trialBtn.style.display = trialStart ? 'none' : 'flex';
  if(trialDivider) trialDivider.style.display = trialStart ? 'none' : 'flex';

  if (mode === "signup") {
    authTitle.innerText = "Create Your Account";
    authDesc.innerText = "Get permanent free access instantly.";
    submitAuthBtn.innerText = "Create Free Account";
    switchAuthTax.innerHTML = `Already have an account? <span onclick="toggleAuthMode('signin')">Sign In</span>`;
  } else {
    authTitle.innerText = "Welcome to Nexis Blink";
    authDesc.innerText = "Sign in to unlock unlimited AI intelligence.";
    submitAuthBtn.innerText = "Sign In";
    switchAuthTax.innerHTML = `Don't have an account? <span onclick="toggleAuthMode('signup')">Sign Up</span>`;
  }
}

function handleAuthSubmit() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value.trim();
  if (!email.includes("@") || pass.length < 4) {
    alert("Thabbet mel email/password mte3ek!");
    return;
  }
  localStorage.setItem("nexis_user_account", email);
  checkUserSession();
}

function socialLogin(provider) {
  localStorage.setItem("nexis_user_account", `user.${provider.toLowerCase()}@nexis.com`);
  checkUserSession();
}

function startFreeTrial() {
  localStorage.setItem("nexis_trial_start", Date.now());
  authOverlay.classList.add('hidden');
  checkUserSession();
}

function startCountdown(startTime) {
  trialTimerBadge.style.display = 'flex';
  if(timerInterval) clearInterval(timerInterval);
  function updateTimer() {
    const remaining = (60 * 60 * 1000) - (Date.now() - startTime);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      alert("Trial Expired!");
      openAuthModal('signup');
    } else {
      const secs = Math.floor(remaining / 1000);
      timerValue.innerText = `${Math.floor(secs / 60)}:${(secs % 60 < 10 ? '0' : '')}${secs % 60}`;
    }
  }
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

function getChatHistory() {
  const history = localStorage.getItem("Nexis_chat_history");
  return history ? JSON.parse(history) : {};
}

function saveChatHistory(history) {
  localStorage.setItem("Nexis_chat_history", JSON.stringify(history));
}

function startNewChat() {
  currentChatId = "chat_" + Date.now();
  chatBox.innerHTML = "";
  appendMessage("Hello! Welcome to Nexis Blink AI, Kifach najem n3awnek lyom?😃", 'bot');
}

function clearAllHistory() {
  if (confirm("T7ebb tfassa5 el-historique?")) {
    localStorage.removeItem("Nexis_chat_history");
    renderHistorySidebar();
    startNewChat();
  }
}

function appendMessage(text, sender) {
  const wrapper = document.createElement('div');
  wrapper.classList.add('message-wrapper');
  if (sender === 'user') wrapper.classList.add('user-wrapper');

  const bubble = document.createElement('div');
  bubble.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');

  const msgText = document.createElement('div');
  msgText.classList.add('message-text');
  msgText.innerText = text;

  bubble.appendChild(msgText);
  wrapper.appendChild(bubble);
  chatBox.appendChild(wrapper);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function renderHistorySidebar() {
  historyList.innerHTML = "";
  const history = getChatHistory();
  Object.keys(history).reverse().forEach(id => {
    const item = document.createElement('div');
    item.classList.add('history-item');
    if (id === currentChatId) item.classList.add('active');
    item.innerHTML = `<i class="fas fa-comment-alt"></i> ${history[id].title}`;
    item.onclick = () => loadChat(id);
    historyList.appendChild(item);
  });
}

function loadChat(id) {
  currentChatId = id;
  chatBox.innerHTML = "";
  renderHistorySidebar();
  const history = getChatHistory();
  if (history[id]) history[id].messages.forEach(msg => appendMessage(msg.text, msg.sender));
}

async function sendMessage() {
  if (isTyping) return;
  const message = userInput.value.trim();
  if (!message) return;

  isTyping = true;
  const selectedModel = modelSelect.value;
  const history = getChatHistory();
  let isBrandNewChat = false;

  if (!history[currentChatId]) {
    isBrandNewChat = true;
    history[currentChatId] = { title: message.split(" ").slice(0, 3).join(" "), messages: [] };
  }

  appendMessage(message, 'user');
  history[currentChatId].messages.push({ sender: 'user', text: message });
  userInput.value = '';
  saveChatHistory(history);
  if (isBrandNewChat) renderHistorySidebar();

  const loader = document.createElement('div');
  loader.classList.add('message-wrapper');
  loader.innerHTML = `<div class="message bot-message"><div class="message-text">Nexis thinking... <div class="typing-indicator"><span></span><span></span><span></span></div></div></div>`;
  chatBox.appendChild(loader);
  chatBox.scrollTop = chatBox.scrollHeight;

  const apiMessages = history[currentChatId].messages.map(m => ({
    role: m.sender === 'user' ? 'user' : 'assistant',
    content: m.text
  }));

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${GROQ_API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ model: selectedModel, messages: apiMessages })
    });
    const data = await response.json();
    chatBox.removeChild(loader);

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      appendMessage(reply, 'bot');
      history[currentChatId].messages.push({ sender: 'bot', text: reply });
      saveChatHistory(history);
    }
  } catch (error) {
    chatBox.removeChild(loader);
    appendMessage("Problem f-connexion, thabbet internet.", 'bot');
  } finally {
    isTyping = false;
  }
}
</script>
